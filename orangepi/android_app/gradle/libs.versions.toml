# Ghim phien ban o mot cho. Sua o day, ca project doi theo.
[versions]
agp = "8.9.1"
kotlin = "2.1.0"
coreKtx = "1.15.0"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
composeBom = "2024.12.01"
datastore = "1.1.1"
serialization = "1.7.3"
okhttp = "4.12.0"
camerax = "1.4.1"
mlkitBarcode = "17.3.0"
coroutines = "1.9.0"

[libraries]
androidx-core-ktx            = { group = "androidx.core",       name = "core-ktx",       version.ref = "coreKtx" }
androidx-activity-compose    = { group = "androidx.activity",   name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime   = { group = "androidx.lifecycle",  name = "lifecycle-runtime-ktx",     version.ref = "lifecycle" }
androidx-lifecycle-compose   = { group = "androidx.lifecycle",  name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle",  name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

androidx-compose-bom         = { group = "androidx.compose",    name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui          = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-graphics    = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-preview     = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-tooling     = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-material3           = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons      = { group = "androidx.compose.material",  name = "material-icons-extended" }

androidx-datastore           = { group = "androidx.datastore",  name = "datastore-preferences", version.ref = "datastore" }
kotlinx-serialization-json   = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android   = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

okhttp                       = { group = "com.squareup.okhttp3", name = "okhttp",     version.ref = "okhttp" }
okhttp-sse                   = { group = "com.squareup.okhttp3", name = "okhttp-sse", version.ref = "okhttp" }

camera-core                  = { group = "androidx.camera", name = "camera-core",      version.ref = "camerax" }
camera-camera2               = { group = "androidx.camera", name = "camera-camera2",   version.ref = "camerax" }
camera-lifecycle             = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camera-view                  = { group = "androidx.camera", name = "camera-view",      version.ref = "camerax" }
mlkit-barcode                = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkitBarcode" }

[plugins]
android-application  = { id = "com.android.application",              version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",         version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",  version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
